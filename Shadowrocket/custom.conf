[General]
update-url = https://raw.githubusercontent.com/chyern/Proxy/main/Shadowrocket/custom.conf

[Proxy Group]
 Apple = select,DIRECT,PROXY,policy-select-name=DIRECT
DEFAULT = select,DIRECT,PROXY,policy-select-name=PROXY

[Rule]

RULE-SET,https://raw.githubusercontent.com/chyern/Proxy/main/Shadowrocket/rule/ad_black.list,REJECT-DROP,notification-interval=86400
RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/e0ee1783c906d557adccab6aecca1c55d3b93417/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT-DROP,notification-interval=86400

# Bank
DOMAIN-SUFFIX,hsbc.com.hk,DIRECT
DOMAIN-SUFFIX,bochk.com,DIRECT

# Apple
DOMAIN-SUFFIX,apple.com, Apple
DOMAIN-SUFFIX,apple.com.cn, Apple
DOMAIN-SUFFIX,icloud.com, Apple
DOMAIN-SUFFIX,icloud.com.cn, Apple

# Coin
DOMAIN-SUFFIX,bnbstatic.com,PROXY
DOMAIN-SUFFIX,binance.com,PROXY

# Docker
DOMAIN-SUFFIX,docker.com,PROXY

# YouTube
DOMAIN-SUFFIX,youtube.com,PROXY

# Google
DOMAIN-SUFFIX,google.com,PROXY

# GitHub
DOMAIN-SUFFIX,github.com,PROXY
DOMAIN-SUFFIX,raw.githubusercontent.com,PROXY

# Poe
DOMAIN-SUFFIX,poe.com,PROXY

# Telegram
IP-ASN,62041,PROXY
IP-ASN,62014,PROXY
IP-ASN,59930,PROXY
IP-ASN,44907,PROXY
IP-ASN,211157,PROXY

# Custom rule sets
RULE-SET,https://raw.githubusercontent.com/chyern/Proxy/main/Shadowrocket/rule/proxy.list,PROXY
RULE-SET,https://raw.githubusercontent.com/chyern/Proxy/main/Shadowrocket/rule/direct.list,DIRECT

# China
GEOIP,CN,DIRECT

# Final
FINAL,DEFAULT

[Host]
localhost = 127.0.0.1

[URL Rewrite]
^https?://(www\.)?g\.cn($|/.*) https://www.google.com$2 302
^https?://(www\.)?google\.cn($|/.*) https://www.google.com$2 302
